<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fasal Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+Bengali:wght@400;600&family=Noto+Sans+Tamil:wght@400;600&family=Noto+Sans+Telugu:wght@400;600&family=Noto+Sans+Gujarati:wght@400;600&family=Noto+Sans+Kannada:wght@400;600&family=Noto+Sans+Malayalam:wght@400;600&family=Noto+Sans+Gurmukhi:wght@400;600&family=Noto+Naskh+Arabic:wght@400;600&family=Noto+Sans+SC:wght@400;600&family=Noto+Sans+JP:wght@400;600&family=Noto+Sans+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1d2a1f; --ink-soft:#4d5b4f; --paper:#f7f3e8; --paper-2:#efe8d6;
  --green:#1f5132; --green-dk:#163726; --gold:#c08a2e; --rule:#d9cfb5; --red:#8f2f24;
  --serif:"IBM Plex Serif",Georgia,serif; --sans:"IBM Plex Sans",system-ui,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.6}
:lang(hi),:lang(mr){font-family:"Noto Sans Devanagari",var(--sans)}
:lang(bn){font-family:"Noto Sans Bengali",var(--sans)}
:lang(ta){font-family:"Noto Sans Tamil",var(--sans)}
:lang(te){font-family:"Noto Sans Telugu",var(--sans)}
:lang(gu){font-family:"Noto Sans Gujarati",var(--sans)}
:lang(kn){font-family:"Noto Sans Kannada",var(--sans)}
:lang(ml){font-family:"Noto Sans Malayalam",var(--sans)}
:lang(pa){font-family:"Noto Sans Gurmukhi",var(--sans)}
:lang(ar),:lang(ur){font-family:"Noto Naskh Arabic",var(--sans)}
:lang(zh-CN){font-family:"Noto Sans SC",var(--sans)}
:lang(ja){font-family:"Noto Sans JP",var(--sans)}
:lang(ko){font-family:"Noto Sans KR",var(--sans)}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
header{background:var(--green-dk);color:#f2ead6;position:sticky;top:env(safe-area-inset-top,0px);z-index:9}
.bar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:12px 0}
.brand{font-family:var(--serif);font-size:1.25rem;font-weight:600;letter-spacing:.2px}
.brand span{color:var(--gold)}
nav{display:flex;gap:16px;flex-wrap:wrap;font-size:.92rem}
nav a{color:#e6dcc4;text-decoration:none;padding:2px 0;border-bottom:1px solid transparent}
nav a:hover,nav a:focus-visible{border-color:var(--gold)}
.spacer{margin-inline-start:auto}
select{font:inherit;font-size:.88rem;padding:6px 10px;border-radius:4px;border:1px solid #3d5a47;background:#12291c;color:#f2ead6}
.btn{font:inherit;font-size:.92rem;font-weight:500;padding:9px 16px;border-radius:4px;border:1px solid var(--green);background:var(--green);color:#fdf9ee;cursor:pointer}
.btn.ghost{background:transparent;color:var(--green);border-color:var(--rule)}
.btn:hover{background:var(--green-dk)}
.btn.ghost:hover{background:var(--paper-2);color:var(--green)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hero{padding:56px 0 40px;border-bottom:1px solid var(--rule)}
h1{font-family:var(--serif);font-size:clamp(1.8rem,4.6vw,2.9rem);line-height:1.2;margin:0 0 14px;max-width:18ch}
.lede{font-size:1.08rem;color:var(--ink-soft);max-width:60ch;margin:0 0 24px}
.cta-row{display:flex;gap:12px;flex-wrap:wrap}
section{padding:40px 0}
h2{font-family:var(--serif);font-size:1.45rem;margin:0 0 18px}
.cards{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:#fffdf6;border:1px solid var(--rule);border-start-start-radius:4px;border-end-end-radius:4px;padding:18px;border-inline-start:3px solid var(--gold)}
.card h3{font-family:var(--serif);font-size:1.08rem;margin:0 0 6px}
.card p{margin:0;color:var(--ink-soft);font-size:.95rem}
.tablewrap{overflow-x:auto;border:1px solid var(--rule);background:#fffdf6}
table{width:100%;border-collapse:collapse;font-size:.95rem;min-width:420px}
th,td{padding:11px 14px;text-align:start;border-bottom:1px solid var(--rule)}
th{background:var(--paper-2);font-weight:600;font-size:.85rem}
tr:last-child td{border-bottom:0}
.up{color:var(--green);font-weight:600}.down{color:var(--red);font-weight:600}
form{display:grid;gap:14px;max-width:440px;background:#fffdf6;border:1px solid var(--rule);padding:20px}
label{display:block;font-size:.88rem;font-weight:500;margin-bottom:5px}
input{font:inherit;width:100%;padding:9px 11px;border:1px solid var(--rule);border-radius:3px;background:var(--paper)}
.err{color:var(--red);font-size:.82rem;min-height:1.1em;display:block}
.toast{position:fixed;inset-inline-end:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--green-dk);color:#f2ead6;padding:12px 18px;border-radius:4px;box-shadow:0 6px 20px rgba(0,0,0,.25);transform:translateY(120%);transition:transform .25s;z-index:20}
.toast.show{transform:none}
footer{background:var(--green-dk);color:#cdbfa0;padding:26px 0;font-size:.9rem}
footer a{color:#e6dcc4}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#15190f;--paper-2:#1f2416;--ink:#f0ead8;--ink-soft:#bcb49c;--rule:#3a3f2c}
 :root:not([data-theme="light"]) .card,:root:not([data-theme="light"]) .tablewrap,:root:not([data-theme="light"]) form{background:#1b2014}}
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <div class="brand">Fasal<span>Flow</span></div>
    <nav>
      <a href="#market" data-i18n="nav1"></a>
      <a href="#predict" data-i18n="nav2"></a>
      <a href="#transport" data-i18n="nav3"></a>
      <a href="#join" data-i18n="nav4"></a>
    </nav>
    <div class="spacer"></div>
    <label class="sr" for="lang" style="font-size:.85rem" data-i18n="lang"></label>
    <select id="lang" aria-label="Language"></select>
  </div>
</header>

<main>
  <div class="hero wrap">
    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n="hsub"></p>
    <div class="cta-row">
      <button class="btn" data-i18n="cta1"></button>
      <button class="btn ghost" data-i18n="cta2"></button>
    </div>
  </div>

  <section class="wrap" id="predict">
    <h2 data-i18n="f0"></h2>
    <div class="cards">
      <div class="card"><h3 data-i18n="f1t"></h3><p data-i18n="f1d"></p></div>
      <div class="card"><h3 data-i18n="f2t"></h3><p data-i18n="f2d"></p></div>
      <div class="card"><h3 data-i18n="f3t"></h3><p data-i18n="f3d"></p></div>
    </div>
  </section>

  <section class="wrap" id="market">
    <h2 data-i18n="tblT"></h2>
    <div class="tablewrap">
      <table>
        <thead><tr>
          <th data-i18n="cCrop"></th><th data-i18n="cMandi"></th>
          <th data-i18n="cPrice"></th><th data-i18n="cChg"></th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>

  <section class="wrap" id="join">
    <h2 data-i18n="frmT"></h2>
    <form id="joinForm" novalidate>
      <div>
        <label for="nm" data-i18n="frmN"></label>
        <input id="nm" data-i18n-ph="frmNph">
        <span class="err" id="nmErr"></span>
      </div>
      <div>
        <label for="ph" data-i18n="frmP"></label>
        <input id="ph" inputmode="numeric" data-i18n-ph="frmPph">
        <span class="err" id="phErr"></span>
      </div>
      <button class="btn" type="submit" data-i18n="frmS"></button>
    </form>
  </section>
</main>

<footer id="transport"><div class="wrap">
  <p data-i18n="ftrT" style="margin:0 0 6px"></p>
  <p data-i18n="ftrR" style="margin:0"></p>
</div></footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

/* ---------- 3. Dynamic rows: text held as KEYS, numbers formatted per locale ---- */
const ROWS=[{c:"c1",m:"m1",p:4720,d:+1.8},{c:"c2",m:"m2",p:7350,d:-0.6},{c:"c3",m:"m3",p:9180,d:+2.4}];

/* ---------- 4. Engine ---------- */
const KEY="ff_lang", $=s=>document.querySelector(s);
const dirOf=c=>(LANGS.find(l=>l[0]===c)||[,,"ltr"])[2];

function pick(){                       // saved choice > browser language > English
  try{const s=localStorage.getItem(KEY); if(s&&T[s])return s;}catch(e){}
  const n=(navigator.language||"en");
  if(T[n])return n;
  const b=n.split("-")[0];
  return Object.keys(T).find(c=>c.split("-")[0]===b)||"en";
}

function t(k,lng){return (T[lng]&&T[lng][k])!=null?T[lng][k]:T.en[k];} // fallback to English

function renderRows(lng){
  const nf=new Intl.NumberFormat(lng);          // digits follow the locale
  $("#rows").innerHTML=ROWS.map(r=>`<tr>
    <td>${t(r.c,lng)}</td><td>${t(r.m,lng)}</td>
    <td>${nf.format(r.p)}</td>
    <td class="${r.d>=0?"up":"down"}">${r.d>=0?"▲":"▼"} ${nf.format(Math.abs(r.d))}%</td></tr>`).join("");
}

function apply(lng){
  document.documentElement.lang=lng;
  document.documentElement.dir=dirOf(lng);      // flips the whole layout for ar / ur
  // every element carrying data-i18n gets its text; data-i18n-ph gets its placeholder
  document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=t(el.dataset.i18n,lng));
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>el.placeholder=t(el.dataset.i18nPh,lng));
  $("#lang").value=lng;
  renderRows(lng);
  // re-translate any validation message that is currently on screen
  ["nm","ph"].forEach(id=>{const e=$("#"+id+"Err"); if(e.dataset.key)e.textContent=t(e.dataset.key,lng);});
  try{localStorage.setItem(KEY,lng);}catch(e){}
}

// build the switcher from LANGS
$("#lang").innerHTML=LANGS.map(([c,n])=>`<option value="${c}" lang="${c}">${n}</option>`).join("");
$("#lang").addEventListener("change",e=>apply(e.target.value));

// form: errors are stored as keys, so they switch language too
function setErr(id,key){const e=$("#"+id+"Err"); e.dataset.key=key||""; e.textContent=key?t(key,$("#lang").value):"";}
$("#joinForm").addEventListener("submit",ev=>{
  ev.preventDefault();
  const lng=$("#lang").value, ok1=$("#nm").value.trim().length>0, ok2=/^\d{10}$/.test($("#ph").value.trim());
  setErr("nm",ok1?"":"eName"); setErr("ph",ok2?"":"ePhone");
  if(ok1&&ok2){
    const to=$("#toast"); to.textContent=t("toast",lng); to.classList.add("show");
    setTimeout(()=>to.classList.remove("show"),3200); $("#joinForm").reset();
  }
});

apply(pick());   // run on load, so the saved language is restored
</script>
